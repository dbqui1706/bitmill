global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "rabbitmq"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: "bitmill-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:8080"]
