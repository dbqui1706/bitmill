name: bitmill

services:
  # 1. PostgreSQL 15+ (Relational Metadata Database - RMDS)
  postgres:
    image: postgres:15-alpine
    container_name: bitmill-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bitmill_media}
      POSTGRES_USER: ${POSTGRES_USER:-bitmill_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bitmill_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bitmill_user} -d ${POSTGRES_DB:-bitmill_media}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. RabbitMQ with Management Web UI & Dead Letter Queue Support
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: bitmill-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-bitmill_mq}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-bitmill_mq_password}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"     # AMQP Protocol
      - "15672:15672"                     # Management Web Dashboard
      - "15692:15692"                     # Prometheus Metrics Endpoint
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Prometheus (Time-Series Metrics Scraping & Storage)
  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: bitmill-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"

  # 4. Grafana Loki (High-efficiency Log Aggregation Engine)
  loki:
    image: grafana/loki:2.9.4
    container_name: bitmill-loki
    restart: unless-stopped
    user: "0:0"
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/tmp/loki
    command: -config.file=/etc/loki/local-config.yaml

  # 5. Promtail (Log Collector Shipping Docker & App Logs to Loki)
  promtail:
    image: grafana/promtail:2.9.4
    container_name: bitmill-promtail
    restart: unless-stopped
    volumes:
      - ./promtail/promtail-config.yaml:/etc/promtail/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
      - loki

  # 6. Grafana (Central Unified Visualization & Dashboard Web UI)
  grafana:
    image: grafana/grafana:10.3.3
    container_name: bitmill-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

volumes:
  postgres_data:
    driver: local
  rabbitmq_data:
    driver: local
  prometheus_data:
    driver: local
  loki_data:
    driver: local
  grafana_data:
    driver: local
