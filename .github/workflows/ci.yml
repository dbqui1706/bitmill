name: CI Quality Gate & Security Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # -------------------------------------------------------------
  # JOB 1: Static Code Analysis, Linter & Race Detection Tests
  # -------------------------------------------------------------
  quality-gate:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Go Runtime
        uses: actions/setup-go@v5
        with:
          go-version-file: go-streaming/go.mod
          cache-dependency-path: go-streaming/go.sum

      - name: Verify Code Formatting (gofmt)
        run: |
          cd go-streaming
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "Error: Unformatted Go files detected:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Enforce Strict Static Analysis (go vet)
        run: |
          cd go-streaming
          go vet ./...

      # [DEV OPTIMIZATION] Temporarily commented out to accelerate development turnaround.
      # Uncomment for release stabilization.
      # - name: Run golangci-lint
      #   uses: golangci/golangci-lint-action@v6
      #   continue-on-error: true
      #   with:
      #     version: latest
      #     working-directory: go-streaming
      #     args: --timeout=5m --verbose

      - name: Run Unit Tests
        run: |
          cd go-streaming
          go test -v ./internal/...

  # -------------------------------------------------------------
  # JOB 2: Buildx Multi-Stage Docker Build & GHCR Publication
  # -------------------------------------------------------------
  build-and-scan:
    name: Build OCI Images & Push to GHCR
    needs: [quality-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      matrix:
        include:
          - name: server
            dockerfile: environment/docker/Dockerfile.server
            image: ghcr.io/${{ github.repository }}/server
          - name: worker
            dockerfile: environment/docker/Dockerfile.worker
            image: ghcr.io/${{ github.repository }}/worker
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # [DEV OPTIMIZATION] Single-pass build & push directly to GHCR with GitHub Actions layer cache.
      # Local duplicate builds and Trivy vulnerability scans are temporarily commented out to accelerate turnaround.
      # Uncomment for pre-production release audit.
      - name: Build & Push Container Images to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.ref == 'refs/heads/main' }}
          load: ${{ github.ref != 'refs/heads/main' }}
          tags: |
            ${{ matrix.image }}:${{ github.sha }}
            ${{ matrix.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # - name: Run Trivy Security Vulnerability Scan
      #   uses: aquasecurity/trivy-action@master
